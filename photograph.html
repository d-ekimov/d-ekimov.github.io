<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анна Смит — Фотограф</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
  body { background: #f8f8f8; color: #111; }

  /* Меню */
  header { display: flex; justify-content: space-between; align-items: center; padding: 30px 10%; background: #fff; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #eee; }
  .logo { font-size: 1.4rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
  nav a { text-decoration: none; color: #111; margin-left: 30px; font-size: 0.9rem; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
  nav a:hover { color: #888; }

  /* Главный экран (Девушка) */
  .hero { display: flex; align-items: center; justify-content: space-between; padding: 80px 10%; gap: 50px; }
  .hero-text { flex: 1; }
  .hero-text h1 { font-size: 3.5rem; font-weight: 300; line-height: 1.2; margin-bottom: 25px; }
  .hero-text p { font-size: 1.1rem; color: #555; margin-bottom: 40px; line-height: 1.8; max-width: 400px; }
  .btn { display: inline-block; padding: 15px 40px; background: #111; color: #fff; text-decoration: none; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; border: 1px solid #111; }
  .btn:hover { background: transparent; color: #111; }
  
  /* Фото девушки */
  .hero-img-wrapper { flex: 1; display: flex; justify-content: flex-end; }
  .hero-img { width: 100%; max-width: 400px; height: 550px; border-radius: 5px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

  /* Галерея (Природа) */
  .gallery-section { padding: 80px 10%; background: #fff; }
  .gallery-title { font-size: 1.5rem; font-weight: 300; margin-bottom: 40px; text-align: center; letter-spacing: 2px; text-transform: uppercase; }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .gallery-item { width: 100%; height: 350px; object-fit: cover; border-radius: 5px; transition: 0.4s; cursor: pointer; }
  .gallery-item:hover { transform: scale(1.03); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }

  /* Подвал */
  footer { text-align: center; padding: 40px; background: #111; color: #fff; font-size: 0.9rem; letter-spacing: 1px; }

  /* Адаптив под телефон */
  @media(max-width: 768px) {
    header { padding: 20px; flex-direction: column; gap: 15px; }
    nav a { margin: 0 10px; font-size: 0.8rem; }
    
    .hero { flex-direction: column-reverse; padding: 40px 20px; text-align: center; }
    .hero-text h1 { font-size: 2.2rem; }
    .hero-text p { margin: 0 auto 30px auto; }
    .hero-img { height: 400px; max-width: 100%; }
    
    .gallery { grid-template-columns: 1fr; }
    .gallery-item { height: 250px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">Anna Smith</div>
    <nav><a href="#">Портфолио</a><a href="#">Обо мне</a><a href="#">Услуги</a></nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>Ловлю моменты вашей жизни</h1>
      <p>Профессиональная съемка портретов, свадеб и бизнес-мероприятий. Естественный свет, живые эмоции и внимание к деталям.</p>
      <a href="#" class="btn">Заказать съемку</a>
    </div>
    <div class="hero-img-wrapper">
      <!-- ВСТАВЬ СЮДА ССЫЛКУ НА ФОТО ДЕВУШКИ -->
      <img src="devushka.jpeg" alt="Фотограф Анна" class="hero-img">
    </div>
  </section>

  <section class="gallery-section">
    <div class="gallery-title">Избранные работы</div>
    <div class="gallery">
      <!-- ВСТАВЬ СЮДА ССЫЛКИ НА ФОТО ПРИРОДЫ -->
      <img src="priroda.jpeg" alt="Природа 1" class="gallery-item">
      <img src="prirodadva.jpeg" alt="Природа 2" class="gallery-item">
      <img src="prirodatri.jpg" alt="Природа 3" class="gallery-item">
    </div>
  </section>

  <footer>&copy; 2026 Anna Smith Photography. Все права защищены.</footer>

</body>
</html>
